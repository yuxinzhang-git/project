<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亚运会 | 日常</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#17212b;--muted:#77818c;--line:#e4e9ed;--green:#087f5b;--green-soft:#e7f5ef;--orange:#d97706;--blue:#2563eb;--shadow:0 10px 28px rgba(27,44,58,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.shell{max-width:1180px;margin:auto;min-height:100vh;padding:0 28px 44px}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.back{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:20px;color:#5e6873;display:grid;place-items:center}.brand-mark{width:34px;height:34px;border-radius:9px;background:#182530;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}.brand h1{font-size:18px;margin:0;font-weight:750}.crumb{color:var(--muted);font-size:13px}.updated{color:var(--muted);font-size:12px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;margin:22px 0 24px}.hero h2{font-size:32px;line-height:1.2;margin:0 0 8px}.hero p{margin:0;color:var(--muted);font-size:14px}.hero-meta{display:flex;gap:9px;align-items:center}.pill{padding:7px 11px;border-radius:20px;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:700}
.datebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.date-controls{display:flex;align-items:center;gap:8px}.date-button,.today-button{height:38px;border:1px solid var(--line);background:#fff;border-radius:8px;color:#53606c;padding:0 13px}.date-button:hover,.today-button:hover,.filter:hover{border-color:#9dcbb3}.date-value{min-width:122px;text-align:center;font-weight:700;color:var(--ink)}.date-value small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}.today-button{color:var(--green);font-weight:700}.filter{height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:0 11px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 276px;gap:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}.section-head h3{font-size:16px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.status-group{margin-bottom:23px}.status-heading{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px}.status-heading b{font-size:11px;color:var(--muted);font-weight:600}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.status-dot.live{background:var(--orange)}.status-dot.upcoming{background:var(--blue)}.matches{display:flex;flex-direction:column;gap:9px}.match{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 17px;box-shadow:var(--shadow);transition:.18s}.match:hover{transform:translateY(-1px);border-color:#9dcbb3}.match-top{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin-bottom:11px}.match-status{font-weight:700;color:var(--green)}.match-status.live{color:var(--orange)}.match-status.upcoming{color:var(--blue)}.match-title{font-size:15px;font-weight:750;margin-bottom:9px}.match-meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:12px}.match-meta span+span:before{content:"·";margin-right:8px;color:#b0b7bd}.score{font-size:16px;font-weight:800;margin-left:auto;white-space:nowrap}.score.muted{color:var(--muted);font-size:13px;font-weight:600}.empty{padding:44px 20px;background:#fff;border:1px dashed #cfd8df;border-radius:10px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:6px}.empty.error strong{color:#b42318}.retry{margin-top:15px;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--green);font-weight:700}
.side{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow);height:max-content}.side h3{font-size:15px;margin:0 0 15px}.summary{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:13px}.summary-item{text-align:center}.summary-item+.summary-item{border-left:1px solid var(--line)}.summary-item strong{display:block;font-size:22px}.summary-item span{color:var(--muted);font-size:11px}.source-note{padding-top:5px;color:var(--muted);font-size:12px;line-height:1.65}.source-note a{color:var(--green);font-weight:700}.loading{opacity:.7}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:760px){.shell{padding:0 16px 30px}.topbar{height:65px}.crumb{display:none}.updated{font-size:11px}.hero{display:block;margin:18px 0}.hero h2{font-size:27px}.hero-meta{margin-top:15px}.datebar{align-items:stretch;flex-direction:column}.date-controls{justify-content:space-between}.date-button,.today-button{padding:0 10px}.date-value{min-width:0;flex:1}.filter{width:100%}.layout{display:block}.side{margin-top:18px}.match{padding:15px 13px}.match-top{align-items:flex-start}.match-title{line-height:1.4}.score{font-size:14px}}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar"><div class="brand"><a class="back" href="/daily.html" aria-label="返回日常">&#8592;</a><div class="brand-mark">AG</div><h1>日常 <span class="crumb">/ 亚运会</span></h1></div><div class="updated" id="updatedAt">等待数据更新</div></header>
  <section class="hero"><div><h2>2026 年亚运会</h2><p>查看当天所有可获取项目的赛果、进行中赛事与后续赛程。</p></div><div class="hero-meta"><span class="pill">官方实时数据</span></div></section>
  <div class="datebar"><div class="date-controls"><button class="date-button" id="previousDay" type="button">前一天</button><div class="date-value" id="dateValue">今天<small id="dateText"></small></div><button class="date-button" id="nextDay" type="button">后一天</button><button class="today-button" id="todayButton" type="button">今天</button></div><label><span class="sr-only">筛选项目</span><select class="filter" id="disciplineFilter"><option value="all">全部项目</option></select></label></div>
  <div class="layout"><section><div class="section-head"><h3 id="scheduleTitle">今日赛程</h3><span id="totalLabel">加载中</span></div><div id="schedule" class="loading"><div class="empty"><strong>正在获取亚运会数据</strong><span>数据来自官方赛事服务，请稍候。</span></div></div></section><aside class="side"><h3>当日概览</h3><div class="summary"><div class="summary-item"><strong id="finishedCount">-</strong><span>已结束</span></div><div class="summary-item"><strong id="liveCount">-</strong><span>进行中</span></div><div class="summary-item"><strong id="upcomingCount">-</strong><span>待开始</span></div></div><div class="source-note">时间按北京时间显示。数据源：<a href="https://results.asiangames2026.org/" target="_blank" rel="noreferrer">亚运会官方赛果</a><br><span id="sourceStatus">正在连接官方服务</span></div></aside></div>
</main>
<script>
const $=id=>document.getElementById(id);
const state={date:today(),payload:null,discipline:'all'};
function today(){const d=new Date();return localDate(d)}
function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function shiftDate(value,days){const d=new Date(`${value}T12:00:00`);d.setDate(d.getDate()+days);return localDate(d)}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateLabel(value){const d=new Date(`${value}T12:00:00`);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function timeLabel(value){if(!value)return '时间待定';const d=new Date(value);return Number.isNaN(d.valueOf())?escapeHtml(value):d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}
function itemsFor(group){return (state.payload?.[group]||[]).filter(item=>state.discipline==='all'||item.discipline===state.discipline)}
function renderDate(){const isToday=state.date===today();$('dateValue').firstChild.textContent=isToday?'今天':dateLabel(state.date);$('dateText').textContent=state.date;$('scheduleTitle').textContent=isToday?'今日赛程':`${dateLabel(state.date)}赛程`}
function renderFilter(){const values=[...new Set(['all',...(state.payload?.finished||[]).concat(state.payload?.live||[],state.payload?.upcoming||[]).map(item=>item.discipline).filter(Boolean)])];const current=state.discipline;$('disciplineFilter').innerHTML=values.map(value=>`<option value="${escapeHtml(value)}">${value==='all'?'全部项目':escapeHtml(value)}</option>`).join('');$('disciplineFilter').value=values.includes(current)?current:'all';state.discipline=$('disciplineFilter').value}
function card(item,group){const participants=(item.participants||[]).map(person=>person.name).filter(Boolean).join(' vs ');const score=Object.values(item.score||{}).filter(Boolean).join(' / ');const status=group==='finished'?'已结束':group==='live'?'进行中':'待开始';return `<article class="match"><div class="match-top"><span class="match-status ${group==='live'?'live':group==='upcoming'?'upcoming':''}">${status} · ${timeLabel(item.start_time)}</span><span>${escapeHtml(item.venue||'场地待定')}</span></div><div class="match-title">${escapeHtml(item.title||item.discipline||'未命名赛事')} ${score?`<span class="score">${escapeHtml(score)}</span>`:`<span class="score muted">赛程</span>`}</div><div class="match-meta"><span>${escapeHtml(item.discipline||'项目待定')}</span>${participants?`<span>${escapeHtml(participants)}</span>`:''}</div></article>`}
function groupMarkup(key,title){const items=itemsFor(key);return `<section class="status-group"><h4 class="status-heading"><i class="status-dot ${key==='live'?'live':key==='upcoming'?'upcoming':''}"></i>${title}<b>${items.length} 项</b></h4>${items.length?`<div class="matches">${items.map(item=>card(item,key)).join('')}</div>`:'<div class="empty"><span>暂无数据</span></div>'}</section>`}
function render(){if(!state.payload)return;const groups=['finished','live','upcoming'];const total=groups.reduce((sum,key)=>sum+itemsFor(key).length,0);$('totalLabel').textContent=`共 ${total} 项`;$('finishedCount').textContent=itemsFor('finished').length;$('liveCount').textContent=itemsFor('live').length;$('upcomingCount').textContent=itemsFor('upcoming').length;$('schedule').classList.remove('loading');$('schedule').innerHTML=groups.map((key,index)=>groupMarkup(key,['已结束','进行中','待开始'][index])).join('')}
function renderError(message){$('totalLabel').textContent='暂不可用';$('schedule').classList.remove('loading');$('schedule').innerHTML=`<div class="empty error"><strong>亚运会数据暂不可用</strong><span>${escapeHtml(message||'官方服务暂时没有返回数据。')}</span><br><button class="retry" id="retry" type="button">重新加载</button></div>`;$('retry').onclick=load}
async function load(){renderDate();$('updatedAt').textContent='正在更新';$('sourceStatus').textContent='正在连接官方服务';$('schedule').classList.add('loading');$('schedule').innerHTML='<div class="empty"><strong>正在获取亚运会数据</strong><span>数据来自官方赛事服务，请稍候。</span></div>';try{const response=await fetch(`/api/sports/asian-games?date=${encodeURIComponent(state.date)}`,{headers:{Accept:'application/json'}});const body=await response.json();if(!response.ok)throw new Error(body.detail||'官方服务返回错误');state.payload=body;state.discipline='all';renderFilter();render();$('updatedAt').textContent=`更新于 ${new Date(body.updated_at||Date.now()).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}`;$('sourceStatus').textContent='数据已通过本地只读代理获取'}catch(error){state.payload=null;$('updatedAt').textContent='更新失败';$('sourceStatus').textContent='请稍后重试';renderError(error.message)}}
$('previousDay').onclick=()=>{state.date=shiftDate(state.date,-1);load()};$('nextDay').onclick=()=>{state.date=shiftDate(state.date,1);load()};$('todayButton').onclick=()=>{state.date=today();load()};$('disciplineFilter').onchange=event=>{state.discipline=event.target.value;render()};load();
</script>
</body>
</html>
