<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网页操作</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0b1a;color:#f7f7fb;min-height:100vh}
.shell{max-width:960px;margin:0 auto;padding:48px 20px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}
h1{font-size:32px;font-weight:700}.back{color:#b9c0d0;text-decoration:none;border:1px solid #303449;padding:9px 14px;border-radius:8px}.back:hover{color:#fff;border-color:#667085}
.eyebrow{font-size:12px;letter-spacing:1px;color:#8892aa;text-transform:uppercase;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.module{display:block;text-decoration:none;color:inherit;border:1px solid #2d3347;background:#121629;padding:24px;border-radius:8px;min-height:170px;transition:.2s}.module:hover{border-color:#6ee7b7;transform:translateY(-2px)}
.icon{font-size:32px;margin-bottom:20px}.module h2{font-size:20px;margin-bottom:8px}.module p{color:#a5acc0;font-size:14px;line-height:1.6}
.tag{display:inline-block;margin-top:20px;color:#6ee7b7;font-size:12px}
</style>
</head>
<body><main class="shell">
<header class="top"><div><div class="eyebrow">WEB OPERATIONS</div><h1>网页操作</h1></div><a class="back" href="/">返回首页</a></header>
<section class="grid"><a class="module" href="/smart.html"><div class="icon">✦</div><h2>智能操作</h2><p>用自然语言搜索、打开和切换 Bilibili 视频，支持根据当前页面继续操作。</p><span class="tag">进入模块 →</span></a><a class="module" href="/browser.html"><div class="icon">◉</div><h2>Browser</h2><p>使用项目专用 Edge 会话打开网页、百度搜索、点击、输入和截图。</p><span class="tag">高级控制台 →</span></a></section>
</main></body>
</html>
