<style>

.shell{max-width:1180px;margin:auto;min-height:100vh;padding:0 28px 40px}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.back{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:20px;color:#5e6873}.brand-mark{width:34px;height:34px;border-radius:9px;background:#182530;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}.brand h1{font-size:18px;margin:0;font-weight:750}.crumb{color:var(--muted);font-size:13px}.updated{color:var(--muted);font-size:12px}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin:22px 0 24px}.hero h2{font-size:32px;line-height:1.2;margin:0 0 8px;letter-spacing:0}.hero p{margin:0;color:var(--muted);font-size:14px}.hero-meta{display:flex;gap:10px;align-items:center}.pill{padding:7px 11px;border-radius:20px;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:700}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{position:relative;border:0;background:transparent;padding:13px 18px;color:var(--muted);font-weight:700}.tab.active{color:var(--ink)}.tab.active:after{content:"";position:absolute;height:3px;left:14px;right:14px;bottom:-1px;background:var(--green);border-radius:3px}.tab b{margin-left:5px;color:inherit;font-size:11px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:15px}.date-strip{display:flex;gap:7px;overflow:auto}.date{min-width:74px;border:1px solid var(--line);background:#fff;padding:9px 10px;border-radius:8px;text-align:center;color:var(--muted);font-size:12px}.date strong{display:block;color:var(--ink);font-size:14px;margin-top:3px}.date.selected{border-color:var(--green);background:var(--green);color:#d8f3e3}.date.selected strong{color:#fff}.history-btn{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#53606c;padding:10px 14px;border-radius:8px;font-size:13px}.history-btn:hover,.date:hover{border-color:#9dcbb3}.layout{display:grid;grid-template-columns:minmax(0,1fr) 295px;gap:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}.section-head h3{font-size:16px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.matches{display:flex;flex-direction:column;gap:10px}.match{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:17px 18px;box-shadow:var(--shadow);transition:.18s}.match:hover{transform:translateY(-1px);border-color:#bddcc9}.match-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:14px}.status{color:var(--green);font-weight:700}.status.live{color:var(--orange)}.status.soon{color:var(--blue)}.teams{display:grid;grid-template-columns:1fr 86px 1fr;align-items:center;gap:12px}.team{display:flex;align-items:center;gap:11px}.team.right{justify-content:flex-end;text-align:right}.crest{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none}.team-name{font-weight:700;font-size:15px}.team-sub{font-size:12px;color:var(--muted);margin-top:3px}.score{text-align:center;font-size:24px;font-weight:800;letter-spacing:1px}.score small{display:block;font-size:11px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:3px}.match-foot{border-top:1px solid #f0f2f4;margin-top:14px;padding-top:10px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.match-foot .detail{color:var(--green);font-weight:700}.side{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow);height:max-content}.side h3{font-size:15px;margin:0 0 16px}.league-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.league-row:last-child{border:0}.league-logo{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:white;font-size:11px;font-weight:800}.league-row strong{display:block;font-size:13px}.league-row span{color:var(--muted);font-size:11px}.side-note{margin-top:15px;padding:12px;background:#f8fafb;border-radius:8px;color:var(--muted);font-size:12px;line-height:1.6}.modal-wrap{position:fixed;inset:0;background:rgba(21,30,37,.38);display:none;align-items:flex-end;justify-content:center;padding:24px;z-index:5}.modal-wrap.show{display:flex}.modal{width:min(760px,100%);max-height:calc(100vh - 48px);overflow:auto;background:#fff;border-radius:14px;padding:25px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal-head{display:flex;justify-content:space-between;align-items:flex-start}.modal h2{font-size:21px;margin:0 0 7px}.modal p{margin:0;color:var(--muted);font-size:13px}.close{border:0;background:#f1f3f5;border-radius:50%;width:30px;height:30px;color:#68727c;font-size:18px}.detail-score{display:flex;justify-content:center;align-items:center;gap:30px;margin:25px 0 20px}.detail-team{text-align:center;min-width:120px}.detail-team .crest{margin:auto auto 8px}.detail-team b{font-size:14px}.big-score{font-size:30px;font-weight:800}.detail-label{color:var(--muted);font-size:11px;text-align:center}.stat-title{font-size:14px;font-weight:750;margin:18px 0 10px}.player-table{width:100%;border-collapse:collapse;font-size:12px}.player-table th{text-align:left;color:var(--muted);font-weight:500;background:#f7f9fa}.player-table th,.player-table td{padding:10px 8px;border-bottom:1px solid var(--line)}.player-table td:not(:first-child),.player-table th:not(:first-child){text-align:center}.player-name{font-weight:700}.player-team{color:var(--muted);font-size:11px;margin-top:2px}.empty{padding:52px 20px;background:#fff;border:1px dashed #d5dce2;border-radius:10px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:6px}.history-panel{display:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px;margin-bottom:18px}.history-panel @media(max-width:760px){.shell{padding:0 16px 28px}.topbar{height:65px}.crumb{display:none}.updated{font-size:11px}.hero{display:block;margin:18px 0}.hero h2{font-size:27px}.hero-meta{margin-top:15px}.layout{display:block}.side{margin-top:18px}.toolbar{align-items:stretch;flex-direction:column}.date-strip{width:100%}.history-btn{align-self:flex-end}.match{padding:15px 13px}.teams{grid-template-columns:1fr 60px 1fr;gap:6px}.team{gap:7px}.team-name{font-size:13px}.score{font-size:21px}.crest{width:32px;height:32px;font-size:10px}.modal-wrap{padding:12px}.modal{padding:19px}.player-table th,.player-table td{padding:9px 4px}.player-table th:nth-child(4),.player-table td:nth-child(4){display:none}}

<body>
<main class="shell">
  <header class="topbar"><div class="brand"><a class="back" href="/daily.html" aria-label="返回日常">&#8592;</a><div class="brand-mark">DA</div><h1>日常 <span class="crumb">/ 体育</span></h1></div><div class="updated">数据更新于 07:30</div></header>
  <section class="hero"><div><h2>体育赛果</h2><p>关注今天的比赛，也可以回看近一个月的赛程与球员表现。</p></div><div class="hero-meta"><span class="pill" id="leagueHint">NBA · 常规赛</span></div></section>
  <nav class="tabs" aria-label="赛事频道"><button class="tab active" data-league="nba">NBA <b>18 场</b></button><button class="tab" data-league="worldcup">世界杯 <b>4 场</b></button></nav>
  <section class="history-panel" id="historyPanel"><div class="section-head"><h3>查询历史比赛</h3><span>仅支持最近 30 天</span></div><div class="history-form"><label class="field">开始日期<input id="fromDate" type="date"></label><label class="field">结束日期<input id="toDate" type="date"></label><button class="search" id="searchHistory">查询</button></div><div class="history-result" id="historyResult">选择日期后查看历史赛果</div></section>
  <div class="toolbar"><div class="date-strip" id="dateStrip"></div><button class="history-btn" id="toggleHistory">⌕ 查询历史</button></div>
  <div class="layout"><section><div class="section-head"><h3 id="todayTitle">今日比赛</h3><span id="countLabel">共 3 场</span></div><div class="matches" id="matches"></div></section><aside class="side"><h3>频道概览</h3><div class="league-row"><div class="league-logo" style="background:#e34b55">NBA</div><div><strong>美国职业篮球联赛</strong><span id="nbaSummary">今日 3 场 · 2 场已结束</span></div></div><div class="league-row"><div class="league-logo" style="background:#16845a">FIFA</div><div><strong>世界杯</strong><span id="wcSummary">今日 2 场 · 小组赛</span></div></div><div class="side-note">点击任意比赛可查看双方首发、得分、篮板、助攻等基础数据。</div></aside></div>
</main>
<div class="modal-wrap" id="modalWrap"><article class="modal"><div class="modal-head"><div><h2 id="modalTitle">比赛详情</h2><p id="modalMeta"></p></div><button class="close" id="closeModal" aria-label="关闭">&#215;</button></div><div class="detail-score"><div class="detail-team"><div class="crest" id="modalAwayCrest"></div><b id="modalAway"></b></div><div><div class="big-score" id="modalScore"></div><div class="detail-label" id="modalStatus"></div></div><div class="detail-team"><div class="crest" id="modalHomeCrest"></div><b id="modalHome"></b></div></div><div class="stat-title">球员基础数据</div><table class="player-table"><thead><tr><th>球员</th><th>得分</th><th>篮板</th><th>助攻</th><th>上场时间</th></tr></thead><tbody id="playerRows"></tbody></table></article></div>
<script>
const data={nba:[{id:1,time:'已结束 · 10:00',status:'Final',away:'热火',awayEn:'MIA',home:'凯尔特人',homeEn:'BOS',as:104,hs:112,venue:'TD Garden',colors:['#e76f51','#16845a'],players:[['杰森·塔图姆','BOS','31','9','7','36:12'],['杰伦·布朗','BOS','24','6','3','34:08'],['巴姆·阿德巴约','MIA','22','11','4','35:40'],['泰勒·希罗','MIA','19','4','6','33:19']]},{id:2,time:'已结束 · 12:30',status:'Final',away:'湖人',awayEn:'LAL',home:'勇士',homeEn:'GSW',as:118,hs:121,venue:'Chase Center',colors:['#f4a261','#5b72c5'],players:[['斯蒂芬·库里','GSW','34','5','8','37:25'],['勒布朗·詹姆斯','LAL','28','8','9','36:02'],['安东尼·戴维斯','LAL','25','14','3','38:10'],['乔纳森·库明加','GSW','21','7','4','31:46']]},{id:3,time:'进行中 · 第三节 05:22',status:'Live',away:'掘金',awayEn:'DEN',home:'雷霆',homeEn:'OKC',as:76,hs:81,venue:'Paycom Center',colors:['#5c6bc0','#ef8354'],players:[['尼古拉·约基奇','DEN','18','8','6','24:21'],['谢伊·吉尔杰斯-亚历山大','OKC','22','3','5','25:04'],['贾马尔·穆雷','DEN','16','3','4','22:58'],['切特·霍姆格伦','OKC','14','7','2','23:11']]}],worldcup:[{id:4,time:'已结束 · 18:00',status:'Final',away:'法国',awayEn:'FRA',home:'巴西',homeEn:'BRA',as:2,hs:1,venue:'大都会球场',colors:['#4267b2','#4caf80'],players:[['基利安·姆巴佩','FRA','1 球','1','0','90′'],['维尼修斯·儒尼奥尔','BRA','1 球','0','1','86′'],['奥斯曼·登贝莱','FRA','1 助攻','0','2','78′'],['卡塞米罗','BRA','0 球','4','1','90′']]},{id:5,time:'未开始 · 21:00',status:'Soon',away:'德国',awayEn:'GER',home:'阿根廷',homeEn:'ARG',as:'-',hs:'-',venue:'梅赛德斯奔驰球场',colors:['#4f78aa','#79a9d1'],players:[['托马斯·穆勒','GER','-','-','-','-'],['弗洛里安·维尔茨','GER','-','-','-','-'],['劳塔罗·马丁内斯','ARG','-','-','-','-'],['亚历克西斯·麦卡利斯特','ARG','-','-','-','-']]}]};
const dates=['07/22','07/21','07/20','07/19','07/18','07/17','07/16'];let league='nba';
const $=id=>document.getElementById(id);function renderDates(){ $('dateStrip').innerHTML=dates.map((d,i)=>`<button class="date ${i===0?'selected':''}" data-day="${d}">${i===0?'今天':'周'+['二','一','日','六','五','四'][i-1]}<strong>${d}</strong></button>`).join('')}
function render(){const games=data[league];$('leagueHint').textContent=league==='nba'?'NBA · 常规赛':'世界杯 · 小组赛';$('countLabel').textContent=`共 ${games.length} 场`;$('todayTitle').textContent=league==='nba'?'今日比赛':'今日比赛';$('matches').innerHTML=games.map(g=>`<button class="match" data-id="${g.id}"><div class="match-top"><span class="status ${g.status==='Live'?'live':g.status==='Soon'?'soon':''}">${g.time}</span><span>${g.venue}</span></div><div class="teams"><div class="team"><div class="crest" style="background:${g.colors[0]}">${g.awayEn}</div><div><div class="team-name">${g.away}</div><div class="team-sub">客队</div></div></div><div class="score">${g.as} <span style="color:#b3bac1">:</span> ${g.hs}<small>${g.status==='Soon'?'赛前':'全场'}</small></div><div class="team right"><div><div class="team-name">${g.home}</div><div class="team-sub">主队</div></div><div class="crest" style="background:${g.colors[1]}">${g.homeEn}</div></div></div><div class="match-foot"><span>${league==='nba'?'常规赛':'小组赛'} · ${g.status==='Live'?'实时更新':'赛后数据'}</span><span class="detail">查看详情 &#8594;</span></div></button>`).join('');document.querySelectorAll('.match').forEach(el=>el.onclick=()=>openDetail(games.find(g=>g.id==el.dataset.id)))}
function openDetail(g){$('modalTitle').textContent=`${g.away} vs ${g.home}`;$('modalMeta').textContent=`${g.venue} · ${g.time}`;$('modalAway').textContent=g.away;$('modalHome').textContent=g.home;$('modalAwayCrest').textContent=g.awayEn;$('modalHomeCrest').textContent=g.homeEn;$('modalAwayCrest').style.background=g.colors[0];$('modalHomeCrest').style.background=g.colors[1];$('modalScore').textContent=`${g.as} : ${g.hs}`;$('modalStatus').textContent=g.status==='Live'?'比赛进行中':g.status==='Soon'?'尚未开始':'比赛结束';$('playerRows').innerHTML=g.players.map(p=>`<tr><td><div class="player-name">${p[0]}</div><div class="player-team">${p[1]}</div></td><td>${p[2]}</td><td>${p[3]}</td><td>${p[4]}</td><td>${p[5]}</td></tr>`).join('');$('modalWrap').classList.add('show')}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');league=t.dataset.league;render()});$('toggleHistory').onclick=()=>{$('historyPanel').classList.toggle('show')};$('closeModal').onclick=()=>$('modalWrap').classList.remove('show');$('modalWrap').onclick=e=>{if(e.target===$('modalWrap'))$('modalWrap').classList.remove('show')};$('searchHistory').onclick=()=>{const f=$('fromDate').value,t=$('toDate').value;if(!f||!t){$('historyResult').textContent='请先选择开始和结束日期';return}const diff=(new Date(t)-new Date(f))/86400000;if(diff<0||diff>30){$('historyResult').textContent='日期范围需在最近 30 天内';return}$('historyResult').innerHTML=`找到 <b>${league==='nba'?'12':'8'} 场</b>历史比赛，已按日期为你整理。`};renderDates();render();
</script>
<script>
var liveLeague = 'nba';
var liveDate = new Date().toISOString().slice(0, 10);
var liveGames = [];
var pad = n => String(n).padStart(2, '0');
var dateText = d => `${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
var statusText = g => g.state === 'post' ? `已结束 · ${new Date(g.date).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'})}` : g.state === 'in' ? `进行中${g.clock ? ` · ${g.clock}` : ''}` : `未开始 · ${new Date(g.date).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'})}`;

function renderLive() {
  $('countLabel').textContent = `共 ${liveGames.length} 场`;
  $('todayTitle').textContent = liveDate === new Date().toISOString().slice(0, 10) ? '今日比赛' : `${liveDate} 比赛`;
  if (!liveGames.length) { $('matches').innerHTML = '<div class="empty"><strong>当天暂无比赛数据</strong><span>可以切换其他日期查看历史赛程。</span></div>'; return; }
  $('matches').innerHTML = liveGames.map(g => { var a=g.away_team||{}, h=g.home_team||{}; return `<button class="match live-match" data-id="${g.id}"><div class="match-top"><span class="status ${g.state==='in'?'live':g.state==='pre'?'soon':''}">${statusText(g)}</span><span>${g.venue||'比赛场馆'}</span></div><div class="teams"><div class="team"><div class="crest" style="background:#557b9d">${a.abbreviation||'客'}</div><div><div class="team-name">${a.name||'客队'}</div><div class="team-sub">客队</div></div></div><div class="score">${a.score||'-'} <span style="color:#b3bac1">:</span> ${h.score||'-'}<small>${g.state==='pre'?'赛前':'全场'}</small></div><div class="team right"><div><div class="team-name">${h.name||'主队'}</div><div class="team-sub">主队</div></div><div class="crest" style="background:#16845a">${h.abbreviation||'主'}</div></div></div><div class="match-foot"><span>${liveLeague==='nba'?'NBA':'世界杯'} · ${g.state==='in'?'实时更新':'官方赛果'}</span><span class="detail">查看详情 &#8594;</span></div></button>`; }).join('');
  document.querySelectorAll('.live-match').forEach(card => card.onclick = () => openLiveDetail(card.dataset.id));
}

async function loadLive() {
  $('matches').innerHTML = '<div class="empty"><strong>正在获取实时赛果</strong><span>数据来自公开赛事接口，请稍候。</span></div>';
  try { var r=await fetch(`/api/sports/feed/${liveLeague}?date=${liveDate}`), body=await r.json(); if(!r.ok) throw new Error(body.detail||'接口请求失败'); liveGames=body.games||[]; $('leagueHint').textContent=liveLeague==='nba'?'NBA · 常规赛':'世界杯 · 当日赛程'; renderLive(); }
  catch(e) { liveGames=[]; $('matches').innerHTML=`<div class="empty"><strong>实时数据暂不可用</strong><span>${e.message}，请稍后刷新。</span></div>`; $('countLabel').textContent='暂无数据'; }
}

function renderLiveDates() { var now=new Date(); $('dateStrip').innerHTML=Array.from({length:7},(_,i)=>{var d=new Date(now);d.setDate(now.getDate()-i);return `<button class="date ${i===0?'selected':''}" data-date="${d.toISOString().slice(0,10)}">${i===0?'今天':'历史'}<strong>${dateText(d)}</strong></button>`}).join(''); document.querySelectorAll('.date').forEach(b=>b.onclick=()=>{document.querySelectorAll('.date').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');liveDate=b.dataset.date;loadLive()}); }

async function openLiveDetail(id) { var g=liveGames.find(x=>String(x.id)===String(id)); if(!g)return; var a=g.away_team||{},h=g.home_team||{}; $('modalTitle').textContent=`${a.name||'客队'} vs ${h.name||'主队'}`; $('modalMeta').textContent=`${g.venue||'比赛场馆'} · ${statusText(g)}`; $('modalAway').textContent=a.name||'客队'; $('modalHome').textContent=h.name||'主队'; $('modalAwayCrest').textContent=a.abbreviation||'客'; $('modalHomeCrest').textContent=h.abbreviation||'主'; $('modalScore').textContent=`${a.score||'-'} : ${h.score||'-'}`; $('modalStatus').textContent=g.state==='in'?'比赛进行中':g.state==='pre'?'尚未开始':'比赛结束'; $('playerRows').innerHTML='<tr><td colspan="5" style="text-align:center;color:#77818c">正在获取球员数据...</td></tr>'; $('modalWrap').classList.add('show'); try { var r=await fetch(`/api/sports/game/${liveLeague}/${id}`),body=await r.json(); if(!r.ok)throw new Error(); var ps=body.players||[]; $('playerRows').innerHTML=ps.length?ps.slice(0,20).map(p=>`<tr><td><div class="player-name">${p.name}</div><div class="player-team">${p.team}</div></td><td>${p.stats.points||p.stats.goals||'-'}</td><td>${p.stats.rebounds||'-'}</td><td>${p.stats.assists||'-'}</td><td>${p.stats.minutes||'-'}</td></tr>`).join(''):'<tr><td colspan="5" style="text-align:center;color:#77818c">该场比赛暂无球员统计</td></tr>'; } catch(e) { $('playerRows').innerHTML='<tr><td colspan="5" style="text-align:center;color:#77818c">球员数据暂不可用</td></tr>'; } }

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');liveLeague=t.dataset.league;loadLive()}); $('searchHistory').onclick=()=>{var f=$('fromDate').value,t=$('toDate').value,d=(new Date(t)-new Date(f))/86400000;if(!f||!t){$('historyResult').textContent='请先选择开始和结束日期';return}if(d<0||d>30||new Date(t)>new Date()){ $('historyResult').textContent='日期范围需在最近 30 天内，且不能晚于今天';return }liveDate=t;$('historyResult').innerHTML=`正在查询 <b>${f}</b> 至 <b>${t}</b> 的${liveLeague==='nba'?' NBA':'世界杯'}赛程，请通过上方日期逐日查看结果。`;loadLive()}; renderLiveDates(); loadLive();
</script>
</body>
</html>
