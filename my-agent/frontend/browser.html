<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser | 网页操作</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0b1a;color:#f7f7fb;min-height:100vh}.shell{max-width:1040px;margin:0 auto;padding:34px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title-row{display:flex;align-items:center;gap:14px}.back{color:#b9c0d0;text-decoration:none;border:1px solid #303449;padding:8px 12px;border-radius:8px}.back:hover{color:#fff;border-color:#667085}h1{font-size:28px}.sub{color:#8f99af;font-size:13px;margin-top:6px}.status{font-size:12px;color:#6ee7b7;border:1px solid #295b4b;padding:7px 10px;border-radius:7px}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:16px}.panel{background:#121629;border:1px solid #2d3347;border-radius:8px;padding:20px}.panel h2{font-size:15px;margin-bottom:16px;color:#e8ebf5}.field{margin-bottom:14px}.field label{display:block;color:#9fa8bc;font-size:12px;margin-bottom:6px}.row{display:flex;gap:8px}.row input,.field input{width:100%;background:#0d1121;border:1px solid #30374d;color:#fff;border-radius:6px;padding:10px 11px;outline:none}.row input:focus,.field input:focus{border-color:#6ee7b7}.button{border:0;border-radius:6px;padding:10px 14px;cursor:pointer;color:#08110e;background:#6ee7b7;font-weight:600;white-space:nowrap}.button.secondary{background:#293149;color:#dbe2f3}.button.danger{background:#4b2631;color:#ffb4c2}.actions{display:flex;gap:8px;flex-wrap:wrap}.meta{border-top:1px solid #293047;margin-top:18px;padding-top:15px;color:#a7afc2;font-size:13px;line-height:1.8;word-break:break-all}.log{min-height:220px;max-height:420px;overflow:auto;background:#0d1121;border-radius:6px;padding:14px;color:#b7c0d4;font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.empty{color:#65708a}.preview{margin-top:16px;border-top:1px solid #293047;padding-top:14px}.preview img{max-width:100%;display:block;border-radius:5px;border:1px solid #30374d}.note{color:#808ba2;font-size:12px;line-height:1.6;margin-top:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px}.status{display:none}}
</style>
</head>
<body><main class="shell"><header class="top"><div class="title-row"><a class="back" href="/web.html">返回</a><div><h1>Browser</h1><div class="sub">Microsoft Edge · 项目持久化登录状态</div></div></div><div class="status" id="status">就绪</div></header>
<div class="layout"><section class="panel"><h2>打开与搜索</h2><div class="field"><label for="url">网页地址</label><div class="row"><input id="url" value="https://www.baidu.com"><button class="button" onclick="openUrl()">打开</button></div></div><div class="field"><label for="keyword">百度搜索</label><div class="row"><input id="keyword" placeholder="输入关键词" onkeydown="if(event.key==='Enter')search()"><button class="button" onclick="search()">搜索</button></div></div><h2>页面操作</h2><div class="field"><label for="locator">Locator（CSS 或 Playwright locator）</label><input id="locator" placeholder="例如：input[name=q] 或 text=登录"></div><div class="field"><label for="text">输入文本</label><div class="row"><input id="text" placeholder="要填写的内容"><button class="button secondary" onclick="typeText()">输入</button><button class="button secondary" onclick="clickTarget()">点击</button></div></div><div class="actions"><button class="button" onclick="takeScreenshot()">截图</button><button class="button danger" onclick="closeBrowser()">关闭浏览器</button></div><p class="note">首次访问需要登录时，请在 Edge 中完成登录；后续操作会复用项目专用会话。</p></section><aside class="panel"><h2>操作结果</h2><div id="meta" class="meta"><span class="empty">尚未执行操作</span></div><div id="log" class="log"><span class="empty">操作日志将在这里显示</span></div><div id="preview" class="preview"></div></aside></div></main>
<script>
function setStatus(text,bad){var el=document.getElementById('status');el.textContent=text;el.style.color=bad?'#ff9eae':'#6ee7b7'}
function log(text){var el=document.getElementById('log');if(el.querySelector('.empty'))el.textContent='';el.textContent+=('['+new Date().toLocaleTimeString()+'] '+text+'\n')}
function render(data){var m=document.getElementById('meta');m.textContent='标题：'+(data.title||'')+'\nURL：'+(data.url||'')+(data.path?'\n截图：'+data.path:'')}
async function call(path,body){setStatus('执行中…');try{var r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});var d=await r.json();if(!r.ok)throw new Error(d.detail||'请求失败');render(d);log(path+' 成功');setStatus('已连接');return d}catch(e){log(path+' 失败：'+e.message);setStatus('失败',true);throw e}}
async function openUrl(){await call('/api/browser/open',{url:document.getElementById('url').value})}
async function search(){await call('/api/browser/search',{keyword:document.getElementById('keyword').value})}
async function clickTarget(){await call('/api/browser/click',{locator:document.getElementById('locator').value})}
async function typeText(){await call('/api/browser/type',{locator:document.getElementById('locator').value,text:document.getElementById('text').value})}
async function takeScreenshot(){var d=await call('/api/browser/screenshot',{});var p=document.getElementById('preview');p.innerHTML='';var img=document.createElement('img');img.src='/browser-screenshots/'+encodeURIComponent(d.filename)+'?t='+Date.now();img.alt='页面截图';p.appendChild(img)}
async function closeBrowser(){try{var r=await fetch('/api/browser/close',{method:'POST'});var d=await r.json();log('浏览器已关闭');setStatus('已关闭');document.getElementById('meta').textContent=d.message}catch(e){log('关闭失败：'+e.message);setStatus('失败',true)}}
</script></body></html>
