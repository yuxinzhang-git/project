<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搞钱控制台</title>
<style>
:root{--bg:#0f1415;--panel:#171e1f;--panel-2:#12191a;--line:#2c3838;--text:#edf4ee;--muted:#91a09d;--amber:#f2b84b;--green:#62ce99;--red:#e88b83;--blue:#7bb7d8}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shell{max-width:1240px;margin:auto;padding:26px 22px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:20px;gap:18px}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--amber)}
h1{font-size:29px;margin-top:2px}.muted,.sub{color:var(--muted)}.sub{font-size:13px}
.back{color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:7px 12px;border-radius:6px;white-space:nowrap}.back:hover{color:var(--text);border-color:var(--amber)}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{background:transparent;color:var(--muted);border:0;border-bottom:2px solid transparent;padding:10px 15px;cursor:pointer;font:inherit}.tab.active{color:var(--text);border-bottom-color:var(--amber)}
.view{display:none}.view.active{display:block}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:19px}.panel+.panel{margin-top:18px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:14px}.panel h2{font-size:17px}.field{margin:14px 0}.field label{display:block;color:#c6d0cb;font-size:12px;margin-bottom:6px}
input,textarea,select{width:100%;background:#0d1213;border:1px solid var(--line);border-radius:5px;color:var(--text);padding:9px;font:inherit;outline:0}input:focus,textarea:focus,select:focus{border-color:var(--amber)}textarea{resize:vertical;min-height:76px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:5px;padding:9px 13px;cursor:pointer;font:inherit}.btn:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--amber);color:#17130a;font-weight:700}.secondary{background:#26322f;color:#dce8df}.danger{background:#422a29;color:#ffd8d4}.actions{display:flex;gap:8px;flex-wrap:wrap}.note{border-top:1px solid var(--line);margin-top:17px;padding-top:13px;font-size:12px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:14px 15px}.metric label{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:22px;margin-top:4px}.green{color:var(--green)}.amber{color:var(--amber)}.blue{color:var(--blue)}
.list{display:grid;gap:9px}.item{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:12px}.item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item-title{font-weight:700}.item-meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:6px}.item-body{color:#c6d0cb;margin-top:8px;white-space:pre-wrap}.item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{font-size:11px;color:var(--amber);white-space:nowrap}.tag.green{color:var(--green)}.tag.blue{color:var(--blue)}.empty{color:var(--muted);padding:24px 0;text-align:center}.legacy{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.legacy-item{border-left:2px solid var(--line);padding-left:10px}.legacy-item label{display:block;color:var(--muted);font-size:12px}.legacy-item strong{display:block;margin-top:3px}
.error{color:var(--red);font-size:13px;margin-top:10px;min-height:20px}.success{color:var(--green);font-size:13px;margin-top:10px;min-height:20px}
.report{display:none;margin-top:16px;border-top:1px solid var(--line);padding-top:16px}.report.visible{display:block}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.report-value{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:10px}.report-value label{display:block;color:var(--muted);font-size:12px}.report-value strong{display:block;font-size:18px;margin-top:3px}.report-note{color:var(--muted);font-size:12px;margin-top:12px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.legacy{grid-template-columns:1fr}.top{align-items:flex-start}.top h1{font-size:24px}}
@media(max-width:480px){.shell{padding:18px 13px 40px}.metrics{grid-template-columns:1fr 1fr}.metric strong{font-size:19px}.row{grid-template-columns:1fr}.tabs{overflow:auto}.tab{white-space:nowrap}}
</style>
</head>
<body>
<main class="shell">
<header class="top">
  <div><div class="eyebrow">INCOME CONTROL ROOM</div><h1>搞钱控制台</h1><p class="muted">想法用于筛选，咸鱼用于记录已落地的一次性交付。</p></div>
  <a class="back" href="/">返回首页</a>
</header>
<nav class="tabs" aria-label="搞钱模块">
  <button class="tab active" data-view="ideas-view">想法</button>
  <button class="tab" data-view="xianyu-view">咸鱼任务</button>
</nav>

<section id="ideas-view" class="view active">
  <div class="layout">
    <form class="panel" id="idea-form">
      <div class="panel-head"><div><div class="eyebrow">IDEA</div><h2>新增想法</h2></div></div>
      <div class="field"><label for="idea-title">标题</label><input id="idea-title" required maxlength="120" placeholder="例如：二手相机估价报告"></div>
      <div class="field"><label for="idea-description">想法描述</label><textarea id="idea-description" placeholder="解决什么问题，面向谁"></textarea></div>
      <div class="field"><label for="idea-target">目标用户</label><input id="idea-target" placeholder="例如：个人卖家、二手店"></div>
      <div class="field"><label for="idea-deliverable">一次性交付物</label><textarea id="idea-deliverable" placeholder="例如：HTML 报告、模板、资料包"></textarea></div>
      <div class="row"><div class="field"><label for="idea-price">建议售价</label><input id="idea-price" type="number" min="0" step="0.01" value="0"></div><div class="field"><label for="idea-cost">预计成本</label><input id="idea-cost" type="number" min="0" step="0.01" value="0"></div></div>
      <div class="field"><label for="idea-risk">主要风险</label><textarea id="idea-risk" placeholder="平台规则、交付难度、数据来源等"></textarea></div>
      <button class="btn primary" type="submit">保存想法</button><div id="idea-message" class="success"></div>
    </form>
    <div>
      <section class="panel"><div class="panel-head"><div><div class="eyebrow">IDEAS</div><h2>想法清单</h2></div><span class="tag" id="idea-count">0 条</span></div><div id="idea-list" class="list"><div class="empty">暂无想法</div></div></section>
      <section class="panel"><div class="panel-head"><div><div class="eyebrow">LEGACY STATE</div><h2>原有搞钱记录</h2></div></div><div class="legacy"><div class="legacy-item"><label>任务</label><strong id="legacy-mission">暂无</strong></div><div class="legacy-item"><label>状态</label><strong id="legacy-status">暂无</strong></div><div class="legacy-item"><label>余额</label><strong id="legacy-balance">¥0</strong></div></div></section>
    </div>
  </div>
</section>

<section id="xianyu-view" class="view">
  <section class="panel" id="estimate-panel">
    <div class="panel-head"><div><div class="eyebrow">MARKET RESEARCH</div><h2>商品估价</h2><p class="sub">从公开搜索结果提取样本并生成区间，不执行发布或沟通。</p></div></div>
    <form id="estimate-form" class="row"><div class="field"><label for="estimate-keyword">商品关键词</label><input id="estimate-keyword" required placeholder="例如：索尼 A7M3"></div><div class="field" style="align-self:end"><button class="btn primary" type="submit">搜索并估价</button></div></form>
    <div id="estimate-message" class="success"></div>
    <div id="estimate-report" class="report"></div>
  </section>
  <div class="metrics">
    <div class="metric"><label>任务总数</label><strong id="total-tasks">0</strong></div><div class="metric"><label>已结清</label><strong id="settled-tasks" class="blue">0</strong></div><div class="metric"><label>成交额</label><strong id="gross-revenue" class="amber">¥0</strong></div><div class="metric"><label>总成本</label><strong id="total-costs">¥0</strong></div><div class="metric"><label>净收益</label><strong id="net-revenue" class="green">¥0</strong></div>
  </div>
  <div class="layout">
    <form class="panel" id="task-form">
      <div class="panel-head"><div><div class="eyebrow">ONE-OFF DELIVERY</div><h2>新增咸鱼任务</h2></div></div>
      <div class="field"><label for="task-title">任务名称</label><input id="task-title" required maxlength="120" placeholder="例如：相机估价资料包"></div>
      <div class="field"><label for="task-need">客户需求</label><textarea id="task-need" placeholder="记录实际要交付的内容"></textarea></div>
      <div class="field"><label for="task-deliverable">交付物</label><textarea id="task-deliverable" placeholder="例如：HTML 报告、资料包、模板"></textarea></div>
      <div class="row"><div class="field"><label for="task-amount">成交金额</label><input id="task-amount" type="number" min="0" step="0.01" value="0"></div><div class="field"><label for="task-costs">直接成本</label><input id="task-costs" type="number" min="0" step="0.01" value="0"></div></div>
      <div class="field"><label for="task-notes">备注</label><textarea id="task-notes" placeholder="平台费用、交付说明等"></textarea></div>
      <button class="btn primary" type="submit">创建任务</button><div id="task-message" class="success"></div>
    </form>
    <section class="panel"><div class="panel-head"><div><div class="eyebrow">TASKS</div><h2>实际落地任务</h2></div><button class="btn secondary" id="refresh-tasks" type="button">刷新</button></div><div id="task-list" class="list"><div class="empty">暂无任务</div></div></section>
  </div>
</section>
</main>
<script src="/money.js?v=20260728-4"></script>
</body>
</html>
