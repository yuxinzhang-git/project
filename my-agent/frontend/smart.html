<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能操作 | 网页操作</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0b1a;color:#f7f7fb;min-height:100vh}.shell{max-width:900px;margin:0 auto;padding:36px 20px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}.back{color:#b9c0d0;text-decoration:none;border:1px solid #303449;padding:8px 12px;border-radius:8px}.back:hover{color:#fff;border-color:#667085}h1{font-size:28px}.sub{font-size:14px;color:#98a2b8;margin-top:7px;line-height:1.6}.panel{background:#121629;border:1px solid #2d3347;border-radius:8px;padding:22px}.label{display:block;font-size:13px;color:#b8c1d5;margin-bottom:8px}.command{display:flex;gap:10px}.command input{flex:1;min-width:0;background:#0d1121;border:1px solid #30374d;border-radius:6px;color:#fff;padding:12px;font-size:15px;outline:none}.command input:focus{border-color:#6ee7b7}.primary{border:0;border-radius:6px;background:#6ee7b7;color:#07120e;font-weight:700;padding:0 18px;cursor:pointer}.primary:disabled{opacity:.55;cursor:wait}.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.example{background:#20273a;border:1px solid #38415a;border-radius:6px;color:#d9e2f2;padding:8px 10px;font-size:13px;cursor:pointer}.example:hover{border-color:#6ee7b7}.result{margin-top:18px;display:none}.result.show{display:block}.summary{background:#0d1121;border:1px solid #293047;border-radius:6px;padding:14px;color:#dce5f4;font-size:14px;line-height:1.7;word-break:break-word}.summary.error{border-color:#6b303d;color:#ffb4c1}.elements{margin-top:14px}.elements h2{font-size:14px;margin-bottom:8px}.element-list{display:flex;flex-wrap:wrap;gap:7px}.element{font-size:12px;border:1px solid #354059;color:#b8c3d8;border-radius:5px;padding:5px 7px}.note{margin-top:14px;color:#8390a7;font-size:12px;line-height:1.6}@media(max-width:620px){.command{flex-direction:column}.primary{height:42px}.top{gap:12px}.back{white-space:nowrap}}
</style>
</head>
<body><main class="shell"><header class="top"><div><h1>智能操作</h1><p class="sub">直接描述要做的事。系统会先读取目标网页可操作元素，再执行受控搜索。</p></div><a class="back" href="/web.html">返回</a></header>
<section class="panel"><label class="label" for="command">告诉我你想做什么</label><div class="command"><input id="command" value="在 Bilibili 搜索 Python 教程" autocomplete="off" onkeydown="if(event.key==='Enter')executeCommand()"><button class="primary" id="run" onclick="executeCommand()">执行</button></div><div class="examples"><button class="example" onclick="useExample('打开 Bilibili')">打开 Bilibili</button><button class="example" onclick="useExample('在 Bilibili 搜索 Python 教程')">在 Bilibili 搜索 Python 教程</button><button class="example" onclick="useExample('播放当前页的下一个视频')">播放当前页的下一个视频</button><button class="example" onclick="useExample('打开第三个视频')">打开第三个视频</button></div><section class="result" id="result"><div class="summary" id="summary"></div><div class="elements" id="elements"></div></section><p class="note">页面导航：打开 Bilibili、搜索、返回结果页。当前页面操作：打开或播放第 N 个视频、播放上下一个、打开当前视频。不写站点时会优先使用当前页面。</p></section>
<script>
function useExample(value){document.getElementById('command').value=value;document.getElementById('command').focus()}
function showResult(message,error){var result=document.getElementById('result'),summary=document.getElementById('summary');result.classList.add('show');summary.className='summary'+(error?' error':'');summary.textContent=message;document.getElementById('elements').innerHTML=''}
async function executeCommand(){var input=document.getElementById('command'),button=document.getElementById('run'),command=input.value.trim();if(!command){showResult('请输入操作指令。',true);return}button.disabled=true;button.textContent='执行中…';showResult('正在读取目标网页元素并执行操作…');try{var response=await fetch('/api/smart/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:command})});var data=await response.json();if(!response.ok)throw new Error(data.detail||'操作失败');showResult(data.action+'：'+data.keyword+'\n\n当前页面：'+data.title+'\n'+data.url+'\n\n'+data.note);var container=document.getElementById('elements');var heading=document.createElement('h2');heading.textContent='已读取 '+data.inspected_count+' 个可操作元素';container.appendChild(heading);var list=document.createElement('div');list.className='element-list';data.inspected_elements.slice(0,12).forEach(function(item){var node=document.createElement('span');node.className='element';node.textContent=item.kind+' · '+item.label;list.appendChild(node)});container.appendChild(list)}catch(error){showResult(error.message,true)}finally{button.disabled=false;button.textContent='执行'}}
</script></main></body>
</html>
