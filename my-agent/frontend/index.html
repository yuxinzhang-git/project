<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>首页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b0b1a;min-height:100vh;overflow-x:hidden;color:#fff}
#app{max-width:960px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px;justify-content:center;align-items:center}
.welcome{font-size:28px;font-weight:700;margin-bottom:48px;background:linear-gradient(135deg,#a78bfa,#6ee7b7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.entry-grid{width:100%;display:flex;flex-direction:column;gap:20px;padding:0 8px}
.entry-card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 20px;border-radius:20px;cursor:pointer;transition:.3s;text-decoration:none;color:#fff;position:relative;overflow:hidden}
.entry-card:active{transform:scale(0.96)}
.entry-card .icon{font-size:48px}
.entry-card .label{font-size:22px;font-weight:600}
.entry-card .desc{font-size:14px;opacity:.6}
.entry-card.daily{background:linear-gradient(135deg,rgba(79,172,254,0.2),rgba(0,242,254,0.1));border:1px solid rgba(79,172,254,0.3)}
.entry-card.study{background:linear-gradient(135deg,rgba(167,139,250,0.2),rgba(110,231,183,0.1));border:1px solid rgba(167,139,250,0.3)}
.entry-card.money{background:linear-gradient(135deg,rgba(245,158,11,0.22),rgba(34,197,94,0.1));border:1px solid rgba(245,158,11,0.34)}
.entry-card.web{background:linear-gradient(135deg,rgba(110,231,183,0.2),rgba(79,172,254,0.1));border:1px solid rgba(110,231,183,0.3)}
.entry-card.daily:hover{background:linear-gradient(135deg,rgba(79,172,254,0.3),rgba(0,242,254,0.15))}
.entry-card.study:hover{background:linear-gradient(135deg,rgba(167,139,250,0.3),rgba(110,231,183,0.15))}
.entry-card.money:hover{background:linear-gradient(135deg,rgba(245,158,11,0.32),rgba(34,197,94,0.16))}
.entry-card.web:hover{background:linear-gradient(135deg,rgba(110,231,183,0.3),rgba(79,172,254,0.16))}
.footer{position:fixed;bottom:16px;font-size:12px;color:rgba(255,255,255,0.15);text-align:center}
</style>
</head>
<body>
<div id="app">
<div class="welcome">我的工具箱</div>
<div class="entry-grid">
<a class="entry-card daily" href="/daily.html">
<div class="icon">🏠</div>
<div class="label">日常</div>
<div class="desc">天气、计算器、体育、账单</div>
</a>
<a class="entry-card study" href="/learning.html">
<div class="icon">📚</div>
<div class="label">学习</div>
<div class="desc">笔记管理、文件整理</div>
</a>
<a class="entry-card web" href="/web.html">
<div class="icon">◉</div>
<div class="label">网页操作</div>
<div class="desc">Browser、搜索、点击、输入与截图</div>
</a>
<a class="entry-card money" href="/money.html">
<div class="icon">￥</div>
<div class="label">搞钱</div>
<div class="desc">生成可执行的收入方案，记录资源与边界</div>
</a>
</div>
</div>
<div class="footer">选择功能入口</div>
</body>
</html>
